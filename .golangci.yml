version: "2"

run:
  build-tags:
    - integration

linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - dupword
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - forbidigo
    - gocheckcompilerdirectives
    - gocritic
    - gosec
    - govet
    - ineffassign
    - intrange
    - makezero
    - mirror
    - modernize
    - nakedret
    - nilerr
    - nilnesserr
    - noctx
    - nolintlint
    - predeclared
    - reassign
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - staticcheck
    - thelper
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
  settings:
    errcheck:
      exclude-functions:
        - (github.com/jackc/pgx/v5.Tx).Rollback
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*os.File).Close
        - (net.Conn).Close
        - (*net/smtp.Client).Close
        - (*mime/multipart.Form).RemoveAll
        - (*github.com/xuri/excelize/v2.File).Close
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      disabled-checks:
        - ifElseChain
    gosec:
      excludes:
        - G101
        - G104
        - G109
        - G115
        - G304
        - G602
        - G703
        - G704
        - G705
    nolintlint:
      require-specific: true
      allow-unused: false
    revive:
      rules:
        - name: atomic
        - name: bool-literal-in-expr
        - name: constant-logical-expr
        - name: context-as-argument
        - name: context-keys-type
        - name: datarace
        - name: defer
        - name: dot-imports
        - name: duplicated-imports
        - name: early-return
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: errorf
        - name: identical-branches
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unnecessary-stmt
        - name: unreachable-code
        - name: unused-parameter
        - name: useless-break
        - name: var-declaration
        - name: waitgroup-by-value
    staticcheck:
      checks:
        - all
        - -QF1001
        - -ST1000
        - -ST1003
        - -ST1005
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
  exclusions:
    generated: strict
    paths:
      - internal/dbgen
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - errcheck
          - gosec
          - noctx
          - unparam

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - internal/dbgen

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
